[package]
name = "mediamerger-app"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Merge video and audio tracks from two encodes of the same movie into a single synced MKV, using audio cross-correlation to compute the mux offset."

[[bin]]
name = "mediamerger"
path = "src/main.rs"

[dependencies]
mediamerger-core = { path = "../mediamerger-core" }
iced = { version = "0.14", features = ["tokio", "svg", "canvas"] }
tokio = { version = "1", features = ["full"] }
rfd = { version = "0.14", features = ["xdg-portal"] }
dark-light = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[package.metadata.deb]
name = "mediamerger"
maintainer = "MediaMerger Contributors"
copyright = "2026"
extended-description = "Merge video and audio tracks from two encodes of the same movie into a single synced MKV, using audio cross-correlation to compute the mux offset."
depends = "mkvtoolnix, ffmpeg"
section = "utils"
priority = "optional"
assets = [
    ["target/release/mediamerger", "usr/bin/", "755"],
    ["assets/mediamerger.desktop", "usr/share/applications/", "644"],
    ["assets/app-icon/mediamerger.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/app-icon/mediamerger-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
]

[package.metadata.generate-rpm]
requires = { mkvtoolnix = "*", ffmpeg = "*" }

[[package.metadata.generate-rpm.assets]]
source = "target/release/mediamerger"
dest = "/usr/bin/mediamerger"
mode = "0755"

[[package.metadata.generate-rpm.assets]]
source = "mediamerger-app/assets/mediamerger.desktop"
dest = "/usr/share/applications/mediamerger.desktop"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "mediamerger-app/assets/app-icon/mediamerger.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/mediamerger.svg"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "mediamerger-app/assets/app-icon/mediamerger-symbolic.svg"
dest = "/usr/share/icons/hicolor/symbolic/apps/mediamerger-symbolic.svg"
mode = "0644"
